# Release: builds the downloads and publishes them as a GitHub release.
#
# Pushing a tag v<version> (the FS_VERSION of src/base.h, e.g. v0.2.0) builds
#   FractalStreamC-macos-arm64.zip       Macs with Apple silicon
#   FractalStreamC-macos-x86_64.zip      Macs with an Intel processor
#   FractalStreamC-linux-x86_64.tar.gz   Linux on 64-bit PCs
# and attaches them to the release of that tag (created if needed). Run by hand (Actions > Release > Run workflow),
# it only builds them: they are under the run's "Artifacts". Steps: docs/building.md, "Making a release".
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Built in Ubuntu 22.04: the program needs the glibc it was built with (2.35) or a newer one, so it runs on
    # Ubuntu 22.04, Debian 12, Fedora 36 and later.
    container: ubuntu:22.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install the compiler and the X11 headers
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential ca-certificates git \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev
      - uses: actions/checkout@v6
      - name: Test suite (no Vulkan driver here, so the GPU tests are skipped)
        run: ./build.sh test
      - name: Pack FractalStreamC-linux-x86_64.tar.gz
        run: tools/make_linux_release.sh
      - name: Try the download as a user would (Vulkan by lavapipe, Mesa's software driver)
        run: |
          apt-get install -y --no-install-recommends libvulkan1 mesa-vulkan-drivers
          T=$(mktemp -d)
          tar -xzf build/FractalStreamC-linux-x86_64.tar.gz -C "$T"
          F=$T/FractalStreamC-linux-x86_64
          cd "$(mktemp -d)"
          "$F/fractalstreamc" --version
          "$F/fractalstreamc" --check "$F/examples/0 - Basics/0 - Mandelbrot set.fstream"
          "$F/fractalstreamc" --render mandelbrot.png --size 256x256 "$F/examples/0 - Basics/0 - Mandelbrot set.fstream"
          test -s mandelbrot.png
          "$F/fractalstreamc" --video zoom.mp4 --seconds 1 --fps 10 --size 160x90 --samples 1 \
            "$F/examples/4 - More/4 - Moving views.fstream"
          test -s zoom.mp4
          echo "newest glibc symbol: $(objdump -T "$F/fractalstreamc" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -n 1)"
      - uses: actions/upload-artifact@v7
        with:
          name: FractalStreamC-linux-x86_64
          path: build/FractalStreamC-linux-x86_64.tar.gz
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64             # Apple silicon
            runner: macos-15
          - arch: x86_64            # Intel (GitHub's last Intel image, macOS 15: retired in 2027)
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Build FractalStreamC.app and FractalStreamC-macos-${{ matrix.arch }}.zip
        # MOLTENVK=download: the official MoltenVK release (version and checksum in tools/make_macos_app.sh)
        run: MOLTENVK=download ./build.sh app
      - name: The video encoder (its ARM NEON code on Apple silicon; no GPU needed)
        run: ./build.sh test video.file_boxes && build/tests video.colors
      - name: Check the app, unzipped as a user would
        run: |
          lipo build/FractalStreamC.app/Contents/MacOS/fractalstreamc -verify_arch ${{ matrix.arch }}
          plutil -p build/FractalStreamC.app/Contents/Info.plist
          T=$(mktemp -d)
          ditto -x -k build/FractalStreamC-macos-${{ matrix.arch }}.zip "$T"
          codesign --verify --deep --strict --verbose=2 "$T/FractalStreamC.app"
          A=$T/FractalStreamC.app/Contents
          cd /    # (the working directory of an app opened from the Finder)
          "$A/MacOS/fractalstreamc" --version
          "$A/MacOS/fractalstreamc" --check "$A/Resources/examples/0 - Basics/0 - Mandelbrot set.fstream"
          test -f "$A/Resources/docs/language.md"
      - name: Render with the bundled MoltenVK (for information; CI Macs may have no usable GPU)
        continue-on-error: true
        env:
          FS_DEBUG: 1               # the GPUs found and the one used
          MVK_CONFIG_LOG_LEVEL: 3   # what MoltenVK says about them
        run: |
          T=$(mktemp -d)
          ditto -x -k build/FractalStreamC-macos-${{ matrix.arch }}.zip "$T"
          cd "$T"
          FractalStreamC.app/Contents/MacOS/fractalstreamc --render mandelbrot.png --size 256x256 \
            "FractalStreamC.app/Contents/Resources/examples/0 - Basics/0 - Mandelbrot set.fstream"
      - uses: actions/upload-artifact@v7
        with:
          name: FractalStreamC-macos-${{ matrix.arch }}
          path: build/FractalStreamC-macos-${{ matrix.arch }}.zip
          if-no-files-found: error

  release:
    name: Publish the release
    needs: [linux, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v6
      - name: Check that the tag is the program's version
        run: |
          VERSION=$(sed -n 's/^#define FS_VERSION "\(.*\)"/\1/p' src/base.h)
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::The tag is $TAG, but FS_VERSION in src/base.h is \"$VERSION\". Set FS_VERSION, commit, and tag that commit (docs/building.md, Making a release)."
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create the release and attach the downloads
        run: |
          ls -l dist
          cat > notes.md <<'EOF'
          ## Download

          | Your computer | File |
          |---|---|
          | Mac with Apple silicon (M1, M2, M3, ...) | **FractalStreamC-macos-arm64.zip** |
          | Mac with an Intel processor | **FractalStreamC-macos-x86_64.zip** |
          | Linux (64-bit PC) | **FractalStreamC-linux-x86_64.tar.gz** |

          Which chip a Mac has: Apple menu > About This Mac.

          **Mac** (macOS 12 or newer): unzip, move FractalStreamC to Applications, and open it. The first time, macOS
          says it could not verify the app (it is not notarized by Apple): on macOS 15 and newer click Done, then
          System Settings > Privacy & Security > Open Anyway; on older versions right-click the app > Open > Open.
          Or install it with one command in Terminal, which avoids the question (it picks the right file for the Mac):

              curl -fL -o /tmp/FractalStreamC.zip "https://github.com/@REPO@/releases/download/@TAG@/FractalStreamC-macos-$(uname -m).zip" && rm -rf /Applications/FractalStreamC.app && ditto -x -k /tmp/FractalStreamC.zip /Applications && open /Applications/FractalStreamC.app

          **Linux**: `tar -xzf FractalStreamC-linux-x86_64.tar.gz`, then run `FractalStreamC-linux-x86_64/fractalstreamc`.
          It needs a Vulkan driver (Ubuntu, Debian: `sudo apt install libvulkan1 mesa-vulkan-drivers`).

          More: [Download and run](https://github.com/@REPO@#download-and-run).
          EOF
          sed -i -e "s#@REPO@#$GH_REPO#g" -e "s#@TAG@#$TAG#g" notes.md
          case "$TAG" in *-*) PRERELEASE=--prerelease ;; *) PRERELEASE= ;; esac   # (v1.0.0-beta: a pre-release)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "FractalStreamC $TAG" --notes-file notes.md $PRERELEASE
          fi
